services:
  companion-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: companion-backend
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.companionapi.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.companionapi.entrypoints=web,websecure"
      - "traefik.http.routers.companionapi.tls=true"
      - "traefik.http.routers.companionapi.tls.certresolver=mytlschallenge"
      - "traefik.http.services.companionapi.loadbalancer.server.port=8000"
      - "traefik.http.routers.companionapi.middlewares=companionapi-headers@docker"
      - "traefik.http.middlewares.companionapi-headers.headers.SSLRedirect=true"
      - "traefik.http.middlewares.companionapi-headers.headers.SSLHost=${BACKEND_DOMAIN}"
      - "traefik.http.middlewares.companionapi-headers.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.companionapi-headers.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.companionapi-headers.headers.STSPreload=true"
      - "traefik.http.middlewares.companionapi-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.companionapi-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.companionapi-headers.headers.browserXSSFilter=true"

networks:
  n8n_default:
    external: true
