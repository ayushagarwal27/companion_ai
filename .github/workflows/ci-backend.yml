name: CI - Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-backend.yml"

jobs:
  build-and-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Import smoke test
        env:
          OPENAI_API_KEY: dummy
          DATABASE_URL: postgresql://user:pass@localhost:5432/companion_ai
          REDIS_URL: redis://localhost:6379/0
        run: uv run python -c "import backend.api.server"
